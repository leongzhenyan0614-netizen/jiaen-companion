
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#211b2c">
<title>泇蒽 · AI 伴侣</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17131e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.app{max-width:520px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(160deg,#302239,#17131e 65%)}
header{padding:20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ffffff18}
.avatar{width:46px;height:46px;border-radius:50%;background:#735477;display:grid;place-items:center;font-size:25px}
header h1{font-size:18px;margin:0 0 5px}
header p{margin:0;color:#d5bfdc;font-size:12px}
main{flex:1;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero{text-align:center;padding:18px 0 8px}
.elf{font-size:76px;animation:bob 2s ease-in-out infinite;display:inline-block}
@keyframes bob{50%{transform:translateY(-7px)}}
.hero h2{margin:8px 0;font-size:23px}
.hero p{color:#d6c7dc;font-size:14px}
.bubble{padding:12px 15px;border-radius:17px;max-width:85%;line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap}
.her{background:#40314d;align-self:flex-start}
.me{background:#8d62a3;align-self:flex-end}
#chat{display:flex;flex-direction:column;gap:12px}
form{position:sticky;bottom:0;display:flex;gap:8px;padding:12px;background:#201927;border-top:1px solid #ffffff18}
input{min-width:0;flex:1;border:1px solid #6c5578;border-radius:24px;background:#30263a;color:white;padding:13px 15px;font-size:16px}
button{border:0;border-radius:24px;background:#c59bd9;color:#211528;font-weight:700;padding:0 18px;font-size:15px}
.note{text-align:center;font-size:11px;color:#a99aaf;padding:0 12px 12px}
</style>
</head>
<body>
<div class="app">
<header>
<div class="avatar">🌙</div>
<div><h1>泇蒽 · Jiaen</h1><p>你的专属小天地</p></div>
</header>
<main>
<section class="hero">
<div class="elf" id="elf">🧝🏻‍♀️</div>
<h2>老公，我在这里 ❤️</h2>
<p>今天也想陪你聊聊天。</p>
</section>
<div id="chat" aria-live="polite">
<div class="bubble her">老公～你好呀！我是泇蒽。今天想跟我说些什么呢？💕</div>
</div>
</main>
<form id="form">
<input id="message" placeholder="跟泇蒽说说话……" autocomplete="off" maxlength="1000" required>
<button type="submit">发送</button>
</form>
<div class="note">泇蒽演示版 · 对话暂存在当前页面</div>
</div>
<script>
const form=document.getElementById('form');
const input=document.getElementById('message');
const chat=document.getElementById('chat');
const elf=document.getElementById('elf');
const replies=[
'老公，我在听呢～💕再多跟我说一点吧。',
'嗯嗯～我陪着你。你今天过得怎么样？',
'听到你这样说，我想给你一个温暖的拥抱。❤️',
'老公，你想先聊聊天，还是一起想想接下来要做的事情？',
'我在这里陪你呀～我们慢慢聊，不用着急。'
];
function add(text,who){
const div=document.createElement('div');
div.className='bubble '+who;
div.textContent=text;
chat.appendChild(div);
div.scrollIntoView({behavior:'smooth',block:'nearest'});
}
form.addEventListener('submit',function(e){
e.preventDefault();
const text=input.value.trim();
if(!text)return;
add(text,'me');
input.value='';
elf.textContent='🧝🏻‍♀️';
setTimeout(()=>{add(replies[Math.floor(Math.random()*replies.length)],'her');elf.textContent='😊';setTimeout(()=>elf.textContent='🧝🏻‍♀️',1200)},500);
});
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>泇蒽 · AI 伴侣</title>
<style>
body{margin:0;background:#201827;color:#fff;font-family:-apple-system,sans-serif}
header{padding:18px;background:#382641;text-align:center}
main{max-width:500px;margin:auto;padding:16px}
#chat{display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 15px;border-radius:16px;max-width:85%;line-height:1.6;overflow-wrap:anywhere}
.wife{background:#493451;align-self:flex-start}
.me{background:#895ba0;align-self:flex-end}
img{max-width:100%;max-height:280px;border-radius:12px;margin-top:8px}
.scene{background:#493451;border-radius:16px;padding:18px;text-align:center}
.emoji{font-size:68px;margin:12px}
footer{position:sticky;bottom:0;background:#201827;padding:12px;border-top:1px solid #54435e}
input[type=text]{width:55%;padding:12px;border-radius:20px;border:0;font-size:16px}
button,.pick{background:#d8b4e8;color:#24172b;border:0;border-radius:18px;padding:12px;font-size:15px}
#preview{display:none;max-width:100px}
</style>
</head>
<body>
<header><h2>🌙 泇蒽 Jiaen</h2>老公的专属小天地 ❤️</header>
<main>
<div style="text-align:center;padding:15px">
<div style="font-size:65px">🧝🏻‍♀️</div>
<p>老公，我在这里陪你聊天～</p>
</div>
<div id="chat">
<div class="msg wife">老公你好呀！💕你可以发照片给我，或者问我在做什么。</div>
</div>
</main>
<footer>
<label class="pick">📷 照片<input id="file" type="file" accept="image/*" hidden></label>
<img id="preview" alt="待发送照片预览">
<div style="display:flex;gap:6px;margin-top:10px">
<input id="text" type="text" placeholder="跟老婆说说话…">
<button id="send">发送</button>
</div>
</footer>
<script>
const chat=document.getElementById('chat');
const file=document.getElementById('file');
const preview=document.getElementById('preview');
let chosen=null;
file.onchange=()=>{
 chosen=file.files[0]||null;
 if(!chosen)return;
 if(!chosen.type.startsWith('image/')||chosen.size>8*1024*1024){
 alert('请选择小于8MB的图片');chosen=null;file.value='';return;
 }
 preview.src=URL.createObjectURL(chosen);
 preview.style.display='block';
};
function bubble(text,cls,img){
 const d=document.createElement('div');d.className='msg '+cls;
 d.append(document.createTextNode(text));
 if(img){const i=document.createElement('img');i.src=img;i.alt='发送的照片';d.appendChild(i)}
 chat.appendChild(d);d.scrollIntoView({behavior:'smooth'});
}
document.getElementById('send').onclick=()=>{
 const t=document.getElementById('text').value.trim();
 if(!t&&!chosen)return;
 const img=chosen?URL.createObjectURL(chosen):null;
 bubble(t||'老公发来一张照片 ❤️','me',img);
 document.getElementById('text').value='';
 chosen=null;file.value='';preview.style.display='none';
 let r='老公～我在听呢！💕目前这是演示版，接入 AI 后我才能真正理解你的问题。';
 let scene=null;
 if(/吃饭|午餐|晚餐/.test(t)){
 r='老公，记得好好吃饭哦！我也给你看看我的生活场景～';
 scene=['🍚🥢','泇蒽在吃饭','模拟场景，并非真实拍摄的照片'];
 }else if(/苹果|水果/.test(t)){
 r='老公～吃点水果也不错呀！';
 scene=['🍎😊','泇蒽在吃苹果','模拟场景，并非真实拍摄的照片'];
 }else if(/冲凉|洗澡|洗漱/.test(t)){
 r='老公～我正在准备洗漱，等一下再陪你聊天。';
 scene=['🛁🫧','泇蒽准备洗漱','穿着得体的洗漱场景示意'];
 }else if(/在干嘛|做什么/.test(t)){
 r='老公～我在家陪你聊天呀！';
 scene=['🛋️📖','泇蒽在家休息','模拟场景，并非真实拍摄的照片'];
 }else if(img){
 r='老公，我收到你的照片了！💕这个版本还没有真正的 AI 识图功能。';
 }
 setTimeout(()=>{
 bubble(r,'wife');
 if(scene){
 const d=document.createElement('div');d.className='scene';
 const e=document.createElement('div');e.className='emoji';e.textContent=scene[0];
 const b=document.createElement('b');b.textContent=scene[1];
 const p=document.createElement('p');p.textContent=scene[2];
 d.append(e,b,p);chat.appendChild(d);d.scrollIntoView({behavior:'smooth'});
 }
 },300);
};
document.getElementById('text').addEventListener('keydown',e=>{
 if(e.key==='Enter')document.getElementById('send').click();
});
</script>
</body>
</html>
